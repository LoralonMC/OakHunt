plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '1.2.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "coreprotect-repo"
        url = "https://maven.playpro.com"
    }
    maven {
        name = "codemc-repo"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi-repo"
        url = "https://repo.extendedclip.com/releases/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.+")
    compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    compileOnly("net.coreprotect:coreprotect:22.4")
    compileOnly("me.clip:placeholderapi:2.11.6")
    implementation("dev.oakheart:oakheart-core:1.3.1")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'dev.oakheart.config', 'dev.oakheart.oakhunt.libs.config'
    relocate 'dev.oakheart.message', 'dev.oakheart.oakhunt.libs.message'
    relocate 'dev.oakheart.command', 'dev.oakheart.oakhunt.libs.command'
    relocate 'dev.oakheart.util', 'dev.oakheart.oakhunt.libs.util'
    archiveClassifier.set('')
}

build.dependsOn shadowJar

# ============================================================
# OakHunt Messages
# ============================================================
# MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Set a message to "" to disable it. Display modes: chat, action_bar
#
# Common placeholders: <hunt> hunt display name, <hunt_id> hunt id,
#   <found> heads found, <total> heads in the hunt, <number> head number,
#   <player> player name, <count> a count, <time> a UTC time,
#   <countdown> time until it, <milestone> milestone (a number or "all")

